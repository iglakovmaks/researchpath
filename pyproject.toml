[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpath"
version = "0.6.2"
description = "An explainable research navigator for computer science literature."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Maksim Iglakov" }
]
dependencies = [
    "fastapi>=0.95",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=1.10",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8"
]

embeddings = [
    "sentence-transformers>=3.0"
]

benchmark = [
    "beir>=2.2.0",
    "sentence-transformers>=3.0"
]

[project.scripts]
researchpath = "researchpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.isort]
known-first-party = ["researchpath"]
